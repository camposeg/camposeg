name: Build and Test MAUI iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install MAUI workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore

    - name: Build iOS app (Release config)
      run: dotnet build YourApp/YourApp.csproj -c Release -f net8.0-ios --no-restore

    - name: Run Unit Tests
      run: dotnet test Tests/YourApp.Tests.csproj --no-build --verbosity normal
